name: Generate voice audition samples

on:
  push:
    branches:
      - arena/3cceb7fa-knowledge-vault
    paths:
      - .github/workflows/generate-voice-auditions.yml

permissions:
  contents: write

env:
  HF_HUB_DISABLE_XET: "1"
  TOKENIZERS_PARALLELISM: "false"

jobs:
  kokoro:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y espeak-ng ffmpeg
      - name: Install Kokoro 0.9.4
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch==2.5.1 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install numpy==1.26.4 kokoro==0.9.4 transformers==4.48.3 soundfile==0.13.1
      - name: Synthesize two-sentence Kokoro audition
        run: |
          mkdir -p audition-out
          python - <<'PY'
          import numpy as np
          import soundfile as sf
          import torch
          from kokoro import KPipeline

          sentences = [
              "Your phone gets signals from satellites more than twenty thousand kilometres above Earth.",
              "Each satellite carries an atomic clock, accurate to a billionth of a second.",
          ]
          torch.manual_seed(42)
          torch.set_num_threads(2)
          pipeline = KPipeline(
              lang_code="b",
              repo_id="hexgrad/Kokoro-82M",
              device="cpu",
          )
          pieces = []
          for sentence in sentences:
              generated = list(pipeline(
                  sentence,
                  voice="bm_george",
                  speed=1.0,
                  split_pattern=r"\n+",
              ))
              if len(generated) != 1:
                  raise RuntimeError(f"Unexpected Kokoro segment count: {len(generated)}")
              audio = np.asarray(generated[0][2], dtype=np.float32).reshape(-1)
              pieces.extend([audio, np.zeros(round(24000 * 0.35), dtype=np.float32)])
          sf.write("audition-out/Kokoro-82M-raw.wav", np.concatenate(pieces), 24000)
          PY
          ffmpeg -hide_banner -loglevel error -y \
            -i audition-out/Kokoro-82M-raw.wav \
            -af "aresample=48000,loudnorm=I=-16:TP=-1.5:LRA=11" \
            -ar 48000 -ac 1 -c:a pcm_s16le audition-out/Kokoro-82M.wav
          ffprobe -v error -show_entries stream=codec_name,sample_rate,channels -show_entries format=duration,size -of json audition-out/Kokoro-82M.wav
      - uses: actions/upload-artifact@v4
        with:
          name: kokoro-audition
          path: audition-out/Kokoro-82M.wav
          retention-days: 1

  melotts:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install MeloTTS at the reviewed commit
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch==2.2.2 torchaudio==2.2.2 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install numpy==1.23.5 scipy==1.10.1 numba==0.58.1 llvmlite==0.41.1 huggingface_hub==0.19.4
          python -m pip install "git+https://github.com/myshell-ai/MeloTTS.git@209145371cff8fc3bd60d7be902ea69cbdb7965a"
      - name: Synthesize two-sentence MeloTTS Indian English audition
        run: |
          mkdir -p audition-out
          python - <<'PY'
          import nltk
          for resource in ("punkt", "averaged_perceptron_tagger", "averaged_perceptron_tagger_eng"):
              nltk.download(resource, quiet=True)

          import numpy as np
          import soundfile as sf
          import torch
          from melo.api import TTS

          sentences = [
              "Your phone gets signals from satellites more than twenty thousand kilometres above Earth.",
              "Each satellite carries an atomic clock, accurate to a billionth of a second.",
          ]
          torch.manual_seed(42)
          np.random.seed(42)
          torch.set_num_threads(2)
          model = TTS(language="EN", device="cpu")
          speaker_id = model.hps.data.spk2id["EN_INDIA"]
          sample_rate = model.hps.data.sampling_rate
          pieces = []
          for sentence in sentences:
              audio = model.tts_to_file(
                  sentence,
                  speaker_id,
                  output_path=None,
                  speed=1.0,
                  quiet=False,
              )
              pieces.extend([audio, np.zeros(round(sample_rate * 0.35), dtype=np.float32)])
          sf.write("audition-out/MeloTTS-Indian-English-raw.wav", np.concatenate(pieces), sample_rate)
          PY
          ffmpeg -hide_banner -loglevel error -y \
            -i audition-out/MeloTTS-Indian-English-raw.wav \
            -af "aresample=48000,loudnorm=I=-16:TP=-1.5:LRA=11" \
            -ar 48000 -ac 1 -c:a pcm_s16le audition-out/MeloTTS-Indian-English.wav
          ffprobe -v error -show_entries stream=codec_name,sample_rate,channels -show_entries format=duration,size -of json audition-out/MeloTTS-Indian-English.wav
      - uses: actions/upload-artifact@v4
        with:
          name: melotts-audition
          path: audition-out/MeloTTS-Indian-English.wav
          retention-days: 1

  publish:
    needs:
      - kokoro
      - melotts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: arena/3cceb7fa-knowledge-vault
      - uses: actions/download-artifact@v4
        with:
          name: kokoro-audition
          path: .github/voice-audition-results
      - uses: actions/download-artifact@v4
        with:
          name: melotts-audition
          path: .github/voice-audition-results
      - name: Record audition provenance
        run: |
          cat > .github/voice-audition-results/audition.json <<'JSON'
          {
            "sentences": [
              "Your phone gets signals from satellites more than twenty thousand kilometres above Earth.",
              "Each satellite carries an atomic clock, accurate to a billionth of a second."
            ],
            "mastering": "48 kHz mono PCM WAV; 350 ms sentence gap; FFmpeg loudnorm I=-16 TP=-1.5 LRA=11; no music or effects",
            "samples": [
              {
                "file": "Kokoro-82M.wav",
                "model": "hexgrad/Kokoro-82M",
                "code_commit": "dfb907a02bba8152ca444717ca5d78747ccb4bec",
                "voice": "bm_george",
                "language": "British English",
                "speed": 1.0,
                "license": "Apache-2.0"
              },
              {
                "file": "MeloTTS-Indian-English.wav",
                "model": "myshell-ai/MeloTTS-English",
                "code_commit": "209145371cff8fc3bd60d7be902ea69cbdb7965a",
                "speaker": "EN_INDIA",
                "language": "Indian English",
                "speed": 1.0,
                "license": "MIT"
              }
            ]
          }
          JSON
      - name: Commit audition results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/voice-audition-results
          git commit -m "Add temporary voice audition samples [skip ci]"
          git push origin HEAD:arena/3cceb7fa-knowledge-vault
