name: Check Chatterbox Sample Transcript

on:
  push:
    branches:
      - arena/3cceb7fa-knowledge-vault
    paths:
      - .github/workflows/transfer-chatterbox-nano.yml

permissions:
  contents: write

jobs:
  transcribe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --quiet faster-whisper
      - name: Transcribe Chatterbox sample
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          python - <<'PY'
          import base64
          import json
          import os
          import urllib.request

          from faster_whisper import WhisperModel

          repository = os.environ['GITHUB_REPOSITORY']
          token = os.environ['GH_TOKEN']
          headers = {
              'Accept': 'application/vnd.github+json',
              'Authorization': f'Bearer {token}',
              'X-GitHub-Api-Version': '2022-11-28',
          }
          blob_sha = 'ae74dc76e3c7ee22b0e2ba48e4f032763c26dfe4'
          request = urllib.request.Request(
              f'https://api.github.com/repos/{repository}/git/blobs/{blob_sha}',
              headers=headers,
          )
          with urllib.request.urlopen(request, timeout=60) as response:
              blob = json.load(response)
          audio_path = '/tmp/chatterbox-sample.wav'
          with open(audio_path, 'wb') as audio:
              audio.write(base64.b64decode(blob['content']))

          model = WhisperModel('small.en', device='cpu', compute_type='int8')
          segments_iter, info = model.transcribe(
              audio_path,
              language='en',
              beam_size=5,
              vad_filter=True,
              word_timestamps=True,
              condition_on_previous_text=False,
          )
          segments = []
          for segment in segments_iter:
              segments.append({
                  'start': segment.start,
                  'end': segment.end,
                  'text': segment.text.strip(),
                  'avg_logprob': segment.avg_logprob,
                  'no_speech_prob': segment.no_speech_prob,
                  'words': [
                      {'start': w.start, 'end': w.end, 'word': w.word, 'probability': w.probability}
                      for w in (segment.words or [])
                  ],
              })
          result = {
              'engine': 'faster-whisper',
              'model': 'small.en',
              'audio_blob': blob_sha,
              'language': info.language,
              'language_probability': info.language_probability,
              'text': ' '.join(s['text'] for s in segments),
              'segments': segments,
          }
          content = json.dumps(result, indent=2) + '\n'
          payload = json.dumps({
              'message': 'Record Chatterbox sample transcript',
              'content': base64.b64encode(content.encode()).decode('ascii'),
              'branch': 'arena/3cceb7fa-knowledge-vault',
          }).encode()
          request = urllib.request.Request(
              f'https://api.github.com/repos/{repository}/contents/.github/chatterbox-asr-sample.json',
              data=payload,
              method='PUT',
              headers={**headers, 'Content-Type': 'application/json'},
          )
          with urllib.request.urlopen(request, timeout=60) as response:
              commit = json.load(response)
          print(result['text'], flush=True)
          print(f'TRANSCRIPT_COMMIT={commit["commit"]["sha"]}', flush=True)
          PY
