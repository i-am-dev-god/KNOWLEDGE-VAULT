name: Recover Chatterbox Transfer Manifest

on:
  push:
    branches:
      - arena/3cceb7fa-knowledge-vault
    paths:
      - .github/workflows/transfer-chatterbox-nano.yml

permissions:
  contents: write

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Recover manifest from completed transfer logs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          python - <<'PY'
          import base64
          import io
          import json
          import os
          from pathlib import Path
          import re
          import urllib.request
          import zipfile

          repository = os.environ['GITHUB_REPOSITORY']
          token = os.environ['GH_TOKEN']
          headers = {
              'Accept': 'application/vnd.github+json',
              'Authorization': f'Bearer {token}',
              'X-GitHub-Api-Version': '2022-11-28',
          }
          request = urllib.request.Request(
              f'https://api.github.com/repos/{repository}/actions/runs/39964541443/logs',
              headers=headers,
          )
          with urllib.request.urlopen(request, timeout=180) as response:
              archive = response.read()
          manifest = None
          with zipfile.ZipFile(io.BytesIO(archive)) as logs:
              for name in logs.namelist():
                  text = logs.read(name).decode('utf-8', errors='replace')
                  for line in text.splitlines():
                      match = re.search(r'CHATTERBOX_MANIFEST=(\{.*\})', line)
                      if match:
                          manifest = json.loads(match.group(1))
          if manifest is None:
              raise RuntimeError('No Chatterbox manifest found in transfer logs')

          content = json.dumps(manifest, indent=2) + '\n'
          payload = json.dumps({
              'message': 'Record temporary Chatterbox transfer manifest',
              'content': base64.b64encode(content.encode()).decode('ascii'),
              'branch': 'arena/3cceb7fa-knowledge-vault',
          }).encode()
          request = urllib.request.Request(
              f'https://api.github.com/repos/{repository}/contents/.github/chatterbox-transfer-manifest.json',
              data=payload,
              method='PUT',
              headers={**headers, 'Content-Type': 'application/json'},
          )
          with urllib.request.urlopen(request, timeout=60) as response:
              result = json.load(response)
          print(f'MANIFEST_RECOVERED parts={len(manifest["parts"])} commit={result["commit"]["sha"]}', flush=True)
          PY
