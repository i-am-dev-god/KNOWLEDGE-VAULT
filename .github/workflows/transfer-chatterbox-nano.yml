name: Transfer Chatterbox Nano

on:
  push:
    branches:
      - arena/3cceb7fa-knowledge-vault
    paths:
      - .github/workflows/transfer-chatterbox-nano.yml

permissions:
  contents: write

jobs:
  transfer:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --quiet huggingface_hub
      - name: Download official model and create temporary Git blobs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HF_HUB_DISABLE_XET: '1'
        shell: bash
        run: |
          python - <<'PY'
          import base64
          import hashlib
          import json
          import os
          from pathlib import Path
          import tarfile
          import time
          import urllib.request

          from huggingface_hub import snapshot_download

          model_dir = Path('/tmp/chatterbox-nano-model')
          snapshot = snapshot_download(
              repo_id='ResembleAI/chatterbox-nano',
              local_dir=model_dir,
              allow_patterns=['*.safetensors', '*.json', '*.txt', '*.pt', '*.model'],
          )
          print(f'MODEL_SNAPSHOT={snapshot}', flush=True)
          files = sorted(
              p for p in model_dir.rglob('*')
              if p.is_file() and '.cache' not in p.parts
          )
          for path in files:
              print(f'MODEL_FILE={path.relative_to(model_dir)} SIZE={path.stat().st_size}', flush=True)

          archive = Path('/tmp/chatterbox-nano.tar.gz')
          with tarfile.open(archive, 'w:gz') as tar:
              tar.dereference = True
              for path in files:
                  tar.add(path, arcname=f'chatterbox-nano/{path.relative_to(model_dir)}', recursive=False)

          archive_bytes = archive.read_bytes()
          archive_sha = hashlib.sha256(archive_bytes).hexdigest()
          chunk_size = 24 * 1024 * 1024
          parts = []
          repository = os.environ['GITHUB_REPOSITORY']
          token = os.environ['GH_TOKEN']
          for index, offset in enumerate(range(0, len(archive_bytes), chunk_size)):
              chunk = archive_bytes[offset:offset + chunk_size]
              payload = json.dumps({
                  'content': base64.b64encode(chunk).decode('ascii'),
                  'encoding': 'base64',
              }).encode('utf-8')
              request = urllib.request.Request(
                  f'https://api.github.com/repos/{repository}/git/blobs',
                  data=payload,
                  method='POST',
                  headers={
                      'Accept': 'application/vnd.github+json',
                      'Authorization': f'Bearer {token}',
                      'Content-Type': 'application/json',
                      'X-GitHub-Api-Version': '2022-11-28',
                  },
              )
              for attempt in range(3):
                  try:
                      with urllib.request.urlopen(request, timeout=180) as response:
                          result = json.load(response)
                      break
                  except Exception:
                      if attempt == 2:
                          raise
                      time.sleep(3 * (attempt + 1))
              parts.append({'index': index, 'sha': result['sha'], 'size': len(chunk)})
              print(f'PART={index} SHA={result["sha"]} SIZE={len(chunk)}', flush=True)

          manifest = {
              'source': 'ResembleAI/chatterbox-nano',
              'archive_sha256': archive_sha,
              'archive_size': len(archive_bytes),
              'parts': parts,
          }
          print('CHATTERBOX_MANIFEST=' + json.dumps(manifest, separators=(',', ':')), flush=True)
          PY
