name: Check Chatterbox Candidate Transcripts

on:
  push:
    branches:
      - arena/3cceb7fa-knowledge-vault
    paths:
      - .github/workflows/transfer-chatterbox-nano.yml

permissions:
  contents: write

jobs:
  transcribe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --quiet faster-whisper
      - name: Transcribe alternate Chatterbox takes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          python - <<'PY'
          import base64
          import io
          import json
          import os
          from pathlib import Path
          import urllib.request
          import zipfile

          from faster_whisper import WhisperModel

          repository = os.environ['GITHUB_REPOSITORY']
          token = os.environ['GH_TOKEN']
          headers = {
              'Accept': 'application/vnd.github+json',
              'Authorization': f'Bearer {token}',
              'X-GitHub-Api-Version': '2022-11-28',
          }
          blob_sha = '807c8a51f53ce8b89d1bd1f8c1d9be87899e6968'
          request = urllib.request.Request(
              f'https://api.github.com/repos/{repository}/git/blobs/{blob_sha}',
              headers=headers,
          )
          with urllib.request.urlopen(request, timeout=60) as response:
              blob = json.load(response)
          candidate_dir = Path('/tmp/chatterbox-candidates')
          candidate_dir.mkdir()
          with zipfile.ZipFile(io.BytesIO(base64.b64decode(blob['content']))) as archive:
              archive.extractall(candidate_dir)

          model = WhisperModel('small.en', device='cpu', compute_type='int8')
          results = []
          for audio_path in sorted(candidate_dir.glob('*.wav')):
              segments_iter, info = model.transcribe(
                  str(audio_path), language='en', beam_size=5, vad_filter=True,
                  condition_on_previous_text=False,
              )
              segments = [
                  {'start': s.start, 'end': s.end, 'text': s.text.strip(),
                   'avg_logprob': s.avg_logprob, 'no_speech_prob': s.no_speech_prob}
                  for s in segments_iter
              ]
              result = {
                  'file': audio_path.name,
                  'text': ' '.join(s['text'] for s in segments),
                  'language_probability': info.language_probability,
                  'segments': segments,
              }
              results.append(result)
              print(f'{audio_path.name}: {result["text"]}', flush=True)

          content = json.dumps({'engine': 'faster-whisper', 'model': 'small.en',
              'archive_blob': blob_sha, 'candidates': results}, indent=2) + '\n'
          payload = json.dumps({
              'message': 'Record Chatterbox candidate transcripts',
              'content': base64.b64encode(content.encode()).decode('ascii'),
              'branch': 'arena/3cceb7fa-knowledge-vault',
          }).encode()
          request = urllib.request.Request(
              f'https://api.github.com/repos/{repository}/contents/.github/chatterbox-asr-candidates.json',
              data=payload, method='PUT', headers={**headers, 'Content-Type': 'application/json'},
          )
          with urllib.request.urlopen(request, timeout=60) as response:
              commit = json.load(response)
          print(f'TRANSCRIPT_COMMIT={commit["commit"]["sha"]}', flush=True)
          PY
