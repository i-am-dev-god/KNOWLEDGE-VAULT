name: Verify selected voice-00 narration

on:
  push:
    branches:
      - arena/3cceb7fa-knowledge-vault
    paths:
      - .github/workflows/verify-voice-00.yml

permissions:
  contents: write

jobs:
  transcribe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --quiet faster-whisper
      - name: Transcribe exact selected-voice master with word timestamps
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          python - <<'PY'
          import base64
          import hashlib
          import json
          import os
          import urllib.error
          import urllib.request

          from faster_whisper import WhisperModel

          repository = os.environ['GITHUB_REPOSITORY']
          token = os.environ['GH_TOKEN']
          headers = {
              'Accept': 'application/vnd.github+json',
              'Authorization': f'Bearer {token}',
              'X-GitHub-Api-Version': '2022-11-28',
          }
          blob_sha = '622ae2673b074f2ad47eba5861bce602c22ae1b7'
          request = urllib.request.Request(
              f'https://api.github.com/repos/{repository}/git/blobs/{blob_sha}', headers=headers,
          )
          with urllib.request.urlopen(request, timeout=60) as response:
              blob = json.load(response)
          audio = base64.b64decode(blob['content'])
          audio_path = '/tmp/voice-00-narration.wav'
          with open(audio_path, 'wb') as output:
              output.write(audio)

          prompt = (
              'Your phone can find you without mobile signal or internet. '
              'The map may need data. GPS itself does not. '
              'GPS satellites orbit about twenty thousand kilometres above Earth. '
              'Each one carries an extremely accurate atomic clock. '
              'Every satellite broadcasts its position, and the exact time its signal was sent. '
              'Your phone measures how long that signal took to arrive. '
              'The timing must be astonishingly precise. '
              'Because radio waves travel at the speed of light, delay becomes distance. '
              'One satellite gives a distance, not a fix. '
              'Three satellites help find your position. A fourth corrects your phone\'s clock. '
              'Without that correction, the position would be wrong. '
              'Imagine invisible spheres around the satellites. '
              'Where the distances meet is your location. That\'s trilateration. '
              'So GPS is a cosmic stopwatch. '
              'Satellites send the time. Your phone turns tiny delays into a dot on the map.'
          )
          model = WhisperModel('medium.en', device='cpu', compute_type='int8')
          segments_iter, info = model.transcribe(
              audio_path, language='en', beam_size=5, vad_filter=False,
              word_timestamps=True, condition_on_previous_text=False,
              initial_prompt=prompt,
          )
          segments = []
          for segment in segments_iter:
              segments.append({
                  'start': segment.start, 'end': segment.end, 'text': segment.text.strip(),
                  'avg_logprob': segment.avg_logprob, 'no_speech_prob': segment.no_speech_prob,
                  'words': [
                      {'start': w.start, 'end': w.end, 'word': w.word, 'probability': w.probability}
                      for w in (segment.words or [])
                  ],
              })
          words = [w for s in segments for w in s['words']]
          result = {
              'engine': 'faster-whisper', 'model': 'medium.en',
              'voice_id': 'voice-00',
              'audio_blob': blob_sha, 'audio_sha256': hashlib.sha256(audio).hexdigest(),
              'language': info.language, 'language_probability': info.language_probability,
              'text': ' '.join(s['text'] for s in segments),
              'mean_word_probability': sum(w['probability'] for w in words) / len(words),
              'low_confidence_words': [w for w in words if w['probability'] < 0.5],
              'segments': segments,
          }
          content = json.dumps(result, indent=2) + '\n'
          output_path = 'shorts/short-14-gps-explainer/transcription-voice-00.json'
          existing_sha = None
          request = urllib.request.Request(
              f'https://api.github.com/repos/{repository}/contents/{output_path}?ref=arena/3cceb7fa-knowledge-vault',
              headers=headers,
          )
          try:
              with urllib.request.urlopen(request, timeout=60) as response:
                  existing_sha = json.load(response)['sha']
          except urllib.error.HTTPError as error:
              if error.code != 404:
                  raise
          payload_dict = {
              'message': 'Verify selected voice-00 narration transcript [skip ci]',
              'content': base64.b64encode(content.encode()).decode('ascii'),
              'branch': 'arena/3cceb7fa-knowledge-vault',
          }
          if existing_sha:
              payload_dict['sha'] = existing_sha
          request = urllib.request.Request(
              f'https://api.github.com/repos/{repository}/contents/{output_path}',
              data=json.dumps(payload_dict).encode(), method='PUT',
              headers={**headers, 'Content-Type': 'application/json'},
          )
          with urllib.request.urlopen(request, timeout=60) as response:
              commit = json.load(response)
          print(result['text'], flush=True)
          print(f'TRANSCRIPT_COMMIT={commit["commit"]["sha"]}', flush=True)
          PY
