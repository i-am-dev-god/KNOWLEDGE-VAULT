name: Verify noise-cancelling voice-00 narration

on:
  push:
    branches:
      - arena/d1582ef5-knowledge-vault
    paths:
      - .github/workflows/verify-noise-cancelling-voice-00.yml
      - media/voiceovers/noise-cancelling/narration.wav

permissions:
  contents: write

jobs:
  transcribe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --quiet faster-whisper
      - name: Transcribe exact selected-voice master with word timestamps
        shell: bash
        env:
          BRANCH: arena/d1582ef5-knowledge-vault
        run: |
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          from faster_whisper import WhisperModel

          audio_path = 'media/voiceovers/noise-cancelling/narration.wav'
          # A short domain prompt avoids the model treating the full script as
          # already-transcribed context and skipping directly to its ending.
          prompt = 'Noise-cancelling headphones. Anti-noise. Destructive interference.'
          model = WhisperModel('medium.en', device='cpu', compute_type='int8')
          segments_iter, info = model.transcribe(
              audio_path, language='en', beam_size=5, vad_filter=False,
              word_timestamps=True, condition_on_previous_text=False,
              initial_prompt=prompt,
          )
          segments = []
          for segment in segments_iter:
              segments.append({
                  'start': segment.start, 'end': segment.end, 'text': segment.text.strip(),
                  'avg_logprob': segment.avg_logprob, 'no_speech_prob': segment.no_speech_prob,
                  'words': [
                      {'start': w.start, 'end': w.end, 'word': w.word, 'probability': w.probability}
                      for w in (segment.words or [])
                  ],
              })
          words = [w for s in segments for w in s['words']]
          result = {
              'engine': 'faster-whisper', 'model': 'medium.en', 'voice_id': 'voice-00',
              'audio_sha256': hashlib.sha256(Path(audio_path).read_bytes()).hexdigest(),
              'language': info.language, 'language_probability': info.language_probability,
              'text': ' '.join(s['text'] for s in segments),
              'mean_word_probability': sum(w['probability'] for w in words) / len(words),
              'low_confidence_words': [w for w in words if w['probability'] < 0.5],
              'segments': segments,
          }
          output = Path('shorts/short-15-noise-cancelling/transcription-voice-00.json')
          output.parent.mkdir(parents=True, exist_ok=True)
          output.write_text(json.dumps(result, indent=2) + '\n')
          print(result['text'], flush=True)
          print('MEAN_WORD_PROBABILITY', result['mean_word_probability'], flush=True)
          PY
          git config user.name "arena-agent"
          git config user.email "arena-agent@users.noreply.github.com"
          git add shorts/short-15-noise-cancelling/transcription-voice-00.json
          git commit -m "Verify noise-cancelling voice-00 narration [skip ci]"
          git push origin "HEAD:refs/heads/$BRANCH"
